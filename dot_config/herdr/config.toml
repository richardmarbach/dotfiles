onboarding = false
[ui]
# Create tabs immediately with generated names instead of prompting
prompt_new_tab_name = false

# Start with the sidebar collapsed, and collapse to zero width
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

tab_bar_position = "bottom"

# Share divider borders between split panes instead of padding them apart
pane_gaps = false
pane_borders = false

[ui.sound]
enabled = false

[experimental]
# Kitty graphics passthrough (Ghostty supports the protocol natively)
kitty_graphics = true

[keys]
# Match tmux: prefix is ctrl+q
prefix = "ctrl+q"

# Match tmux: s/v splits like vim
split_horizontal = "prefix+s"
split_vertical = "prefix+v"

# Match tmux: prefix+arrows move between splits
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# settings moved off prefix+s (taken by split)
settings = "prefix+."

# Match tmux: L goes back to the previous space
previous_workspace = "prefix+shift+l"
next_workspace = "prefix+shift+h"

# Match tmux: S opens the session navigator (choose-session)
goto = "prefix+shift+s"

# Match tmux: d detaches
detach = "prefix+d"

# Match tmux: comma renames the tab (window)
rename_tab = "prefix+comma"
